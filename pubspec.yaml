  build_runner: ^2.1.7
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.0.3+1
  json_serializable: ^6.7.0
  stacked_generator: null

dependency_overrides:
  intl: 0.20.2

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/1024.png"
  remove_alpha_ios: "true"


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - lib/i18n/
    - .env
  
  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/ProductSans-Regular.ttf
        - asset: assets/fonts/ProductSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ProductSans-Bold.ttf
          weight: 700
